doctrine:
    dbal:
        connections:
           default:
                use_savepoints: true
                url: '%env(resolve:DATABASE_URL)%'
                server_version: '15'
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            NotificationShared:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Notification/Shared/Infrastructure/Entity'
                prefix: 'App\Notification\Shared\Infrastructure\Entity'
                alias: NotificationShared
            NotificationManagement:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Notification/Management/Infrastructure/Entity'
                prefix: 'App\Notification\Management\Infrastructure\Entity'
                alias: NotificationManagement

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
